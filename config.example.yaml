# ============================================================
# F-1 Job Hunter Agent — Central Configuration
# Edit this file to customize your search without touching code
# ============================================================

# ----- AI Settings -----
ai:
  # Optional local-LLM second opinion (Ollama). Rule-based visa/clearance/YOE
  # filtering always runs; the LLM can only ADD rejections. Small models were
  # observed to reject nearly everything, so this is OFF by default.
  enabled: false
  model: "llama3.2"          # Change to "mistral" for deeper analysis
  ollama_url: "http://localhost:11434"
  timeout_seconds: 45
  max_description_chars: 4000  # Truncate long JDs before sending to LLM

# ----- Schedule -----
schedule_time: "19:00"  # 7:00 PM daily

# ----- Email Delivery -----
# Credentials are loaded from .env (never store passwords here)
# See README for Gmail App Password setup instructions
email:
  enabled: false              # set true after filling .env and recipient_email
  smtp_host: "smtp.gmail.com"
  smtp_port: 587
  # sender_email and app_password come from .env file
  recipient_email: ""   # your address; leave empty to disable sending
  subject_template: "🔥 F-1 Job Digest — {date} | {total} new jobs ({ats} ATS · {bigtech} BigTech)"
  include_attachments: true   # Attach the raw .md files as well
  include_bigtech: true       # Include Track B section in the email
  include_ats: true           # Include Track A section in the email


# ----- Your Profile (used to personalize AI prompt) -----
profile:
  graduation_year: 2027       # used in the optional LLM prompt only
  status: "F-1 OPT"

