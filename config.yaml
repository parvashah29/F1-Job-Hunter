# ----- Track B: Big Tech Direct Career Pages (Playwright) -----
track_b:
  companies:
    - name: "Meta"
      base_url: "https://www.metacareers.com"
      search_url: "https://www.metacareers.com/jobs/?q=university+graduate+data+scientist&offices[0]=United+States"
      type: "playwright"

    - name: "Amazon"
      base_url: "https://www.amazon.jobs"
      search_url: "https://www.amazon.jobs/en/search?base_query=new+grad+data+scientist&loc_query=United+States&sort=relevant"
      type: "playwright"

    - name: "Google"
      base_url: "https://careers.google.com"
      search_url: "https://careers.google.com/jobs/results/?q=university+graduate+data+scientist&location=United+States"
      type: "playwright"

    - name: "Microsoft"
      base_url: "https://jobs.microsoft.com"
      search_url: "https://jobs.microsoft.com/us/en/search?keywords=data+scientist+new+grad&experience=University+Graduates"
      type: "playwright"

    - name: "Apple"
      base_url: "https://jobs.apple.com"
      search_url: "https://jobs.apple.com/en-us/search?search=new+grad+data+scientist&sort=relevance"
      type: "playwright"

    - name: "NVIDIA"
      base_url: "https://nvidia.wd5.myworkdayjobs.com"
      search_url: "https://nvidia.wd5.myworkdayjobs.com/NVIDIAExternalCareerSite?q=new+grad+data+scientist"
      type: "playwright"

    - name: "Netflix"
      base_url: "https://jobs.netflix.com"
      search_url: "https://jobs.netflix.com/search?q=data+scientist+new+grad"
      type: "playwright"

    - name: "OpenAI"
      base_url: "https://openai.com"
      search_url: "https://openai.com/careers/"
      type: "playwright"

    - name: "Salesforce"
      base_url: "https://careers.salesforce.com"
      search_url: "https://careers.salesforce.com/en/jobs/?search=data+scientist+new+grad&country=United+States"
      type: "playwright"

    - name: "Adobe"
      base_url: "https://careers.adobe.com"
      search_url: "https://careers.adobe.com/us/en/search-results?keywords=data+scientist+new+grad"
      type: "playwright"

  max_jobs_per_company: 15
  page_load_timeout: 30000   # ms
  min_delay_seconds: 2       # minimum delay between page navigations
  max_delay_seconds: 5       # maximum delay (randomized for anti-bot)

# ----- Limits -----
limits:
  track_a_report_max: 25    # Max jobs in daily_jobs report
  track_b_report_max: 30    # Max jobs in bigtech_jobs report (all qualifying shown)
